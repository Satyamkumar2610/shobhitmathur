        <h1>Shobhit Mathur</h1>
        <p>Shobhit Mathur is an education entrepreneur, institution builder, policy thinker, and writer. He is Vice Chancellor and Co-Founder of Rishihood University.</p>
        <p>Shobhit Mathur writes on education reform, higher education, public policy, technology policy, and India's institutional future. His work has been published in The Hindu, ThePrint, The Economic Times, Livemint, The Indian Express, Hindustan Times, NDTV, Swarajya, and Financial Express.</p>
        <h2>About Shobhit Mathur</h2>
        <p>Shobhit Mathur began his career in technology at Amazon's headquarters in Seattle. He then moved to social transformation, helping scale Youth For Seva into a national volunteering movement. Through the Vision India Foundation, he worked with young Indians engaged in public policy. He co-founded Rishihood University with the belief that India needs universities that prepare students to understand society, create knowledge, build enterprises, and shape the nation's future.</p>
